{% extends "base.html" %}
{% block content %}
<main class="container auth-container">
  <div class="auth-card">
    <h1>כניסה לעריכה</h1>
    <p class="auth-sub">הצפייה פתוחה לכולם. לעריכת הלוח יש להזין את סיסמת העריכה.</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>שם <span class="muted">(לא חובה)</span>
        <input type="text" name="name" autocomplete="off" placeholder="השם שלך">
      </label>
      <label>סיסמה
        <input type="password" name="password" required autofocus>
      </label>
      <div class="auth-actions">
        <button class="btn btn-primary" type="submit">כניסה</button>
        <a class="btn btn-ghost" href="{{ url_for('schedule.index') }}">חזרה ללוח</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
